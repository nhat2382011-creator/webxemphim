<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CineVault — Kho Link Phim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07080d;
  --panel:#111420;
  --panel-2:#171b2b;
  --line:#ffffff1a;
  --ink:#f4f6fb;
  --muted:#9aa3b8;
  --accent:#6366f1;
  --accent-2:#8b5cf6;
  --ok:#34d399;
  --err:#f87171;
  --sans:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{
  background:radial-gradient(circle at 20% 0%,#1a1f38,var(--bg) 62%) fixed;
  color:var(--ink);
  font-family:var(--sans);
  padding:20px;
  padding-bottom:calc(32px + env(safe-area-inset-bottom,0px));
}
.wrap{max-width:1040px;margin:0 auto}
header{
  display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;
  margin-bottom:20px;padding:16px 20px;background:var(--panel);border:1px solid var(--line);border-radius:18px;
}
.brand h1{font-size:1.35rem;font-weight:700;letter-spacing:-.01em}
.brand p{color:var(--muted);font-size:.85rem;margin-top:2px}

/* Ẩn khung form thêm phim và chuyển lưới về 1 cột */
.grid{display:block}
aside.card{display:none}

.card{
  background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;
  box-shadow:0 16px 40px #00000044;
}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  font:inherit;font-weight:600;font-size:.9rem;border:0;border-radius:11px;padding:11px 14px;
  cursor:pointer;transition:opacity .15s,transform .12s;
}
.btn:hover{opacity:.92}
.btn:active{transform:translateY(1px)}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff}
.btn-ghost{background:#ffffff0d;color:var(--ink);border:1px solid var(--line)}
.btn-sm{padding:7px 12px;font-size:.8rem;border-radius:9px}

/* Rạp chiếu */
.player-box{margin-bottom:20px}
.player-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.player-title{font-size:1.1rem;font-weight:600}
.player-meta{font-size:.82rem;color:var(--muted)}
.stage{
  position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:14px;
  overflow:hidden;border:1px solid var(--line);display:grid;place-items:center;
}
.stage iframe,.stage video{width:100%;height:100%;border:0;background:#000}
.stage-empty{text-align:center;color:var(--muted);padding:20px;font-size:.9rem}

/* Thanh lọc */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.toolbar input,.toolbar select{
  font:inherit;font-size:.92rem;color:var(--ink);background:var(--panel-2);
  border:1px solid var(--line);border-radius:11px;padding:10px 12px;
}
.toolbar input{flex:1;min-width:180px}
.toolbar select{width:auto;min-width:140px}
.toolbar input:focus,.toolbar select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px #6366f133}

.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.item{
  background:var(--panel-2);border:1px solid var(--line);border-radius:14px;overflow:hidden;
  display:flex;flex-direction:column;
}
.thumb{
  position:relative;aspect-ratio:16/9;background:linear-gradient(135deg,#1e2542,#0f1324);
  display:grid;place-items:center;overflow:hidden;cursor:pointer;
}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb span{font-size:1.8rem;font-weight:700;color:#ffffff55}
.pill{
  position:absolute;top:8px;left:8px;padding:3px 8px;border-radius:999px;
  background:#000000aa;font-size:.72rem;color:#fff;
}
.item-body{padding:12px;flex:1;display:flex;flex-direction:column;gap:6px}
.item-title{font-weight:600;font-size:.95rem;line-height:1.35}
.item-sub{font-size:.78rem;color:var(--muted)}
.item-note{font-size:.8rem;color:#cbd5e1;line-height:1.4}
.item-actions{display:flex;gap:6px;margin-top:auto;padding-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1>CineVault</h1>
      <p>Danh sách video phát trực tuyến</p>
    </div>
  </header>

  <div class="grid">
    <aside class="card" aria-hidden="true"></aside>

    <main>
      <section class="card player-box">
        <div class="player-head">
          <div>
            <div class="player-title" id="player-title">Chưa chọn video</div>
            <div class="player-meta" id="player-meta">Chọn một video bên dưới để phát</div>
          </div>
        </div>
        <div class="stage" id="stage">
          <div class="stage-empty">Chọn video bên dưới để bắt đầu xem</div>
        </div>
      </section>

      <section class="card">
        <div class="toolbar">
          <input type="search" id="search" placeholder="Tìm theo tên video hoặc ghi chú...">
          <select id="filter-genre">
            <option value="">Tất cả thể loại</option>
            <option value="Hành động">Hành động</option>
            <option value="Viễn tưởng">Viễn tưởng</option>
            <option value="Hoạt hình">Hoạt hình</option>
            <option value="Tình cảm">Tình cảm</option>
            <option value="Kinh dị">Kinh dị</option>
            <option value="Khác">Khác</option>
          </select>
          <select id="filter-fav">
            <option value="all">Tất cả video</option>
            <option value="fav">Chỉ yêu thích</option>
          </select>
        </div>
        <div class="list" id="movie-list"></div>
      </section>
    </main>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let movies = [];

function ytId(url){
  const m = String(url || '').match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([A-Za-z0-9_-]{6,})/);
  return m ? m[1] : null;
}

function vimeoId(url){
  const m = String(url || '').match(/vimeo\.com\/(?:video\/)?(\d+)/);
  return m ? m[1] : null;
}

function driveEmbedUrl(url){
  const m = String(url || '').match(/drive\.google\.com\/file\/d\/([A-Za-z0-9_-]+)/);
  return m ? `https://drive.google.com/file/d/${m[1]}/preview` : null;
}

function resolvePoster(m){
  if (m.poster) return m.poster;
  const yid = ytId(m.url || '');
  if (yid) return `https://img.youtube.com/vi/${yid}/hqdefault.jpg`;
  return '';
}

function playMovie(m){
  $('player-title').textContent = `${m.title} (${m.year || 'N/A'})`;
  $('player-meta').textContent = `${m.genre || 'Khác'}`;

  const stage = $('stage');
  stage.innerHTML = '';

  const yid = ytId(m.url);
  if (yid){
    const ifr = document.createElement('iframe');
    ifr.src = `https://www.youtube.com/embed/${yid}?autoplay=1`;
    ifr.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
    ifr.allowFullscreen = true;
    stage.appendChild(ifr);
    return;
  }

  const vid = vimeoId(m.url);
  if (vid){
    const ifr = document.createElement('iframe');
    ifr.src = `https://player.vimeo.com/video/${vid}?autoplay=1`;
    ifr.allow = 'autoplay; fullscreen; picture-in-picture';
    ifr.allowFullscreen = true;
    stage.appendChild(ifr);
    return;
  }

  const drv = driveEmbedUrl(m.url);
  if (drv){
    const ifr = document.createElement('iframe');
    ifr.src = drv;
    ifr.allow = 'autoplay; fullscreen';
    ifr.allowFullscreen = true;
    stage.appendChild(ifr);
    return;
  }

  if (/\.(mp4|webm|ogg|m3u8)(\?.*)?$/i.test(m.url)){
    const video = document.createElement('video');
    video.src = m.url;
    video.controls = true;
    video.autoplay = true;
    stage.appendChild(video);
    return;
  }

  const ifr = document.createElement('iframe');
  ifr.src = m.url;
  ifr.allow = 'autoplay; fullscreen; picture-in-picture';
  ifr.allowFullscreen = true;
  stage.appendChild(ifr);
}

async function loadMovies(){
  try {
    const res = await fetch('/api/movies', { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    movies = Array.isArray(data.movies) ? data.movies : [];
    renderList();
  } catch {
    $('movie-list').innerHTML = '<div class="stage-empty">Không tải được danh sách video từ server.</div>';
  }
}

function renderList(){
  const q = $('search').value.trim().toLowerCase();
  const g = $('filter-genre').value;
  const f = $('filter-fav').value;

  const filtered = movies.filter(m => {
    if (g && m.genre !== g) return false;
    if (f === 'fav' && !m.fav) return false;
    if (q && !m.title.toLowerCase().includes(q) && !(m.note || '').toLowerCase().includes(q)) return false;
    return true;
  });

  const list = $('movie-list');
  list.innerHTML = '';
  if (!filtered.length){
    list.innerHTML = '<div class="stage-empty">Chưa có video nào trong kho trên server.</div>';
    return;
  }

  filtered.forEach(m => {
    const card = document.createElement('article');
    card.className = 'item';

    const poster = resolvePoster(m);
    const thumb = document.createElement('div');
    thumb.className = 'thumb';
    thumb.onclick = () => playMovie(m);
    if (poster){
      const img = document.createElement('img');
      img.src = poster;
      img.alt = m.title;
      thumb.appendChild(img);
    } else {
      const sp = document.createElement('span');
      sp.textContent = m.title.trim().charAt(0).toUpperCase() || 'V';
      thumb.appendChild(sp);
    }
    const pill = document.createElement('div');
    pill.className = 'pill';
    pill.textContent = m.genre || 'Khác';
    thumb.appendChild(pill);

    const body = document.createElement('div');
    body.className = 'item-body';
    body.innerHTML = `
      <div class="item-title">${escapeHtml(m.title)}</div>
      <div class="item-sub">${escapeHtml(m.year || 'Không rõ năm')}</div>
      ${m.note ? `<div class="item-note">${escapeHtml(m.note)}</div>` : ''}
    `;

    const actions = document.createElement('div');
    actions.className = 'item-actions';

    const btnPlay = document.createElement('button');
    btnPlay.type = 'button';
    btnPlay.className = 'btn btn-primary btn-sm';
    btnPlay.textContent = 'Xem video';
    btnPlay.onclick = () => playMovie(m);

    actions.append(btnPlay);
    body.appendChild(actions);
    card.append(thumb, body);
    list.appendChild(card);
  });
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

$('search').oninput = renderList;
$('filter-genre').onchange = renderList;
$('filter-fav').onchange = renderList;

loadMovies();
</script>
</body>
</html>
